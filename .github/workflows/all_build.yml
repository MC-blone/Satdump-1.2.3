name: Build All

on: [push, workflow_dispatch]

env:
  BUILD_TYPE: Release
  DEPS_BRANCH: Build-temp

permissions:
  contents: write

jobs:
  build_windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-windows
            arch: x64
            artifact_arch: x64
          - platform: arm64-windows
            arch: ARM64
            artifact_arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg
          key: windows-${{ matrix.platform }}-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install mako
          "SATDUMP_PYTHON_EXECUTABLE=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Configure-vcpkg.ps1" -platform "${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean vcpkg temporary files
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          foreach ($dir in @("packages", "downloads", "buildtrees")) {
            $path = Join-Path $env:GITHUB_WORKSPACE "vcpkg\$dir"
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      - name: Configure CMake
        shell: powershell
        run: |
          $args = @(
            "-A", "${{ matrix.arch }}",
            "-DBUILD_MSVC=ON",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.platform }}",
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake",
            "-DPLUGIN_LIMESDR_SDR_SUPPORT=OFF",
            "-DPLUGIN_USRP_SDR_SUPPORT=OFF",
            "-DPLUGIN_SDRPLAY_SDR_SUPPORT=OFF",
            "-DPLUGIN_HYDRASDR_SDR_SUPPORT=OFF",
            "-DPLUGIN_FOBOSSDR_SDR_SUPPORT=OFF"
          )

          if ("${{ matrix.arch }}" -eq "ARM64") {
            $args += @(
              "-DVCPKG_HOST_TRIPLET=x64-windows",
              "-DVCPKG_USE_HOST_TOOLS=ON",
              "-DCMAKE_SYSTEM_VERSION=10.0.22621.0"
            )
          }

          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE\build" @args

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: powershell
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" --config $env:BUILD_TYPE --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Installer
        shell: powershell
        working-directory: ${{github.workspace}}\build
        run: |
          cpack -C $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_${{ matrix.artifact_arch }}_Installer
          path: ${{github.workspace}}/build/SatDump-*.exe
          if-no-files-found: error

      - name: Add dumpbin to PATH
        shell: powershell
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $version = (Get-ChildItem $vs | Sort-Object Name -Descending | Select-Object -First 1).Name
          "$vs\$version\bin\Hostx64\x64" >> $env:GITHUB_PATH

      - name: Build Portable
        shell: powershell
        working-directory: ${{github.workspace}}\build
        run: |
          & "$env:GITHUB_WORKSPACE\windows\make_portable.ps1" `
            -source_path "$env:GITHUB_WORKSPACE" `
            -triplet "${{ matrix.platform }}"

          if (-not (Test-Path "portable\satdump.exe")) {
            throw "Portable package was not generated correctly"
          }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_${{ matrix.artifact_arch }}_Portable
          path: ${{github.workspace}}/build/portable/*
          if-no-files-found: error

  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout SatDump source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show structure
        run: |
          echo "===== android/ ====="
          ls -la android/ || true
          echo "===== .gitmodules ====="
          cat .gitmodules || true

      - name: Restore prebuilt deps from Build-temp
        shell: bash
        run: |
          set -e
          git clone --no-checkout --depth 1 --branch "$DEPS_BRANCH" \
            https://github.com/MC-blone/Satdump-1.2.3.git /tmp/deps-cache
          cd /tmp/deps-cache
          git checkout "$DEPS_BRANCH" -- android/deps
          mkdir -p "$GITHUB_WORKSPACE/android"
          rm -rf "$GITHUB_WORKSPACE/android/deps"
          cp -r android/deps "$GITHUB_WORKSPACE/android/deps"
          rm -rf /tmp/deps-cache
          ls -la "$GITHUB_WORKSPACE/android/deps/output/arm64-v8a/lib/" | head -50 || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'

      - name: Install NDK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;25.2.9519653'; then
              test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
              exit 0
            fi
            rm -rf "$ANDROID_SDK_ROOT/ndk/25.2.9519653" "$ANDROID_SDK_ROOT/.temp"
            sleep $((attempt * 5))
          done
          echo 'FATAL: NDK could not be installed'
          exit 1

      - name: Install Gradle 7.6.4
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$(dirname "$apk")"
          test -f "$apk"
          cp "$apk" SatDump-1.2.3-Android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satdump-android
          path: SatDump-1.2.3-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  build_ubuntu_2204:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-22.04
          path: ${{runner.workspace}}/build/*.deb
          if-no-files-found: error

      - name: Setup pkg2appimage
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          wget https://raw.githubusercontent.com/probonopd/AppImages/master/pkg2appimage
          chmod +x pkg2appimage
          sudo apt install -y imagemagick desktop-file-utils libfuse2 ffmpeg

      - name: Make AppImage
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          set -e
          cp *.deb /tmp/satdump.deb
          cp $GITHUB_WORKSPACE/SatDump.yml .
          ./pkg2appimage SatDump.yml || true

          APPDIR="SatDump/SatDump.AppDir"
          if [ ! -d "$APPDIR" ]; then
            echo "AppDir not found, pkg2appimage failed"
            ls -la
            exit 1
          fi

          # 不维护图标：ffmpeg 现场生成 256x256 透明占位 PNG
          rm -f "$APPDIR/.DirIcon" "$APPDIR/icon.png" "$APPDIR/satdump.png"
          ffmpeg -y -loglevel error \
            -f lavfi -i "color=c=black@0.0:s=256x256:d=1" \
            -frames:v 1 -pix_fmt rgba "$APPDIR/icon.png"
          cp "$APPDIR/icon.png" "$APPDIR/satdump.png"

          # desktop 的 Icon= 改相对名
          DESKTOP_FILE=$(find "$APPDIR" -maxdepth 1 -name "*.desktop" | head -1)
          if [ -n "$DESKTOP_FILE" ]; then
            sed -i 's|^Icon=.*|Icon=satdump|' "$DESKTOP_FILE"
            grep '^Icon=' "$DESKTOP_FILE"
          fi

          ln -sf satdump.png "$APPDIR/.DirIcon"

          # 关键：先清空 out/，确保 artifact 只有一个 AppImage
          rm -rf out
          mkdir -p out

          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool "$APPDIR" out/SatDump-x86_64.AppImage

          # 只保留正式产物，防止 pkg2appimage 或其他残留混进 artifact
          find out -maxdepth 1 -type f -name "*.AppImage" ! -name "SatDump-x86_64.AppImage" -delete
          echo "===== out/ contents ====="
          ls -la out/

          if [ "$(find out -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -ne 1 ]; then
            echo "ERROR: expected exactly one AppImage in out/"
            ls -la out/
            exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-AppImage
          path: ${{runner.workspace}}/build/out/*.AppImage
          if-no-files-found: error

  build_ubuntu_2404:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-24.04
          path: ${{runner.workspace}}/build/*.deb
          if-no-files-found: error

  build_linux_arm64:
    if: ${{ false }}
    runs-on: ARM64
    steps:
      - run: echo "Linux ARM64 build skipped"

  update_nightly_release:
    needs:
      - build_windows
      - build_ubuntu_2204
      - build_ubuntu_2404
      - build_android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly_assets

      - name: Install zip
        run: sudo apt install -y zip

      - name: Copy files
        shell: bash
        run: |
          set -e
          mkdir -p satdump_out

          cp nightly_assets/SatDump-Ubuntu-22.04/*.deb satdump_out/satdump_ubuntu_22.04_amd64.deb
          cp nightly_assets/SatDump-Ubuntu-24.04/*.deb satdump_out/satdump_ubuntu_24.04_amd64.deb
          (cd nightly_assets/SatDump-Windows_x64_Portable && zip -qr "$GITHUB_WORKSPACE/satdump_out/SatDump-Windows_x64_Portable.zip" .)
          cp nightly_assets/SatDump-Windows_x64_Installer/*.exe satdump_out/SatDump-Windows_x64_Installer.exe
          cp nightly_assets/satdump-android/SatDump-1.2.3-Android-arm64.apk satdump_out/SatDump-Android.apk

          APPIMAGE=$(find nightly_assets/SatDump-AppImage -maxdepth 1 -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: no AppImage found"
            ls -la nightly_assets/SatDump-AppImage || true
            exit 1
          fi
          cp "$APPIMAGE" satdump_out/SatDump.AppImage

          (cd nightly_assets/SatDump-Windows_arm64_Portable && zip -qr "$GITHUB_WORKSPACE/satdump_out/SatDump-Windows_arm64_Portable.zip" .)
          cp nightly_assets/SatDump-Windows_arm64_Installer/*.exe satdump_out/SatDump-Windows_arm64_Installer.exe

          echo "===== nightly_out contents ====="
          ls -lh satdump_out/

      - name: Ensure Night-build release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Night-build
        shell: bash
        run: |
          set -e
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG not found, creating..."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Night-build" \
              --notes "自动 nightly 构建，每次 push 到 main 时自动更新。" \
              --prerelease
          else
            echo "Release $TAG already exists."
          fi

      - name: Update Night-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Night-build
        run: |
          gh release upload "$TAG" satdump_out/* \
            --repo "${{github.repository}}" \
            --clobber

  publish_test_release:
    name: Publish Test-1.2.3-v1.0
    needs:
      - build_windows
      - build_android
      - build_ubuntu_2204
      - build_ubuntu_2404
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare release files
        shell: bash
        run: |
          set -e
          mkdir -p release

          copy_one() {
            local pattern="$1"
            local output="$2"
            local files=("$pattern"/*)
            if [ ! -d "$pattern" ] || [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "Expected exactly one file in $pattern"
              ls -la "$pattern" || true
              exit 1
            fi
            cp "${files[0]}" "release/$output"
          }

          copy_one release_assets/SatDump-Windows_x64_Installer SatDump-Windows_x64_Installer.exe
          copy_one release_assets/SatDump-Windows_arm64_Installer SatDump-Windows_arm64_Installer.exe
          copy_one release_assets/SatDump-Ubuntu-22.04 satdump_ubuntu_22.04_amd64.deb
          copy_one release_assets/SatDump-Ubuntu-24.04 satdump_ubuntu_24.04_amd64.deb
          copy_one release_assets/SatDump-AppImage SatDump.AppImage
          copy_one release_assets/satdump-android SatDump-Android-arm64.apk

          (cd release_assets/SatDump-Windows_x64_Portable && zip -qr "$GITHUB_WORKSPACE/release/SatDump-Windows_x64_Portable.zip" .)
          (cd release_assets/SatDump-Windows_arm64_Portable && zip -qr "$GITHUB_WORKSPACE/release/SatDump-Windows_arm64_Portable.zip" .)

          echo "===== Release files ====="
          ls -lh release/
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Test-1.2.3-v1.0
        shell: bash
        run: |
          set -e

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "SatDump 1.2.3 v1.0 Test" \
                --notes "正式测试构建。包含 Windows x64/ARM64、Ubuntu 22.04/24.04、AppImage 和 Android ARM64。"
            else
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "SatDump 1.2.3 v1.0 Test" \
                --notes "正式测试构建。包含 Windows x64/ARM64、Ubuntu 22.04/24.04、AppImage 和 Android ARM64。" \
                --target "$GITHUB_SHA"
            fi
          fi

          gh release upload "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Release published:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"