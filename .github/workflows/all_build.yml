name: Build SatDump Android (Official Deps)

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  DEPS_BRANCH: Android-build
  DEPS_COMMIT: e1980c335f5afef1829efc5c67601aa7ef3005f4

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # ========== 1. Checkout SatDump 源码 ==========
      - name: Checkout SatDump source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show structure
        run: |
          echo "===== root ====="
          ls -la
          echo "===== android/ ====="
          ls -la android/ || true
          echo "===== .gitmodules ====="
          cat .gitmodules || true

      # ========== 2. 准备官方 Android-Dependencies ==========
      - name: Clone official Android-Dependencies
        run: |
          git clone https://github.com/SatDump/Android-Dependencies.git /tmp/Android-Dependencies
          cd /tmp/Android-Dependencies
          git checkout ${{ env.DEPS_COMMIT }}
          echo "===== deps repo content ====="
          ls -la
          echo "===== build.sh ====="
          cat build.sh | head -100

      # ========== 3. 把官方 deps 放到 android/deps ==========
      - name: Place deps into android/deps
        run: |
          rm -rf android/deps
          cp -r /tmp/Android-Dependencies android/deps
          rm -rf android/deps/.git
          echo "===== android/deps ====="
          ls -la android/deps

      # ========== 4. 安装基础环境 ==========
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'

      - name: Install NDK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;25.2.9519653'; then
              test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
              exit 0
            fi
            rm -rf "$ANDROID_SDK_ROOT/ndk/25.2.9519653" "$ANDROID_SDK_ROOT/.temp"
            sleep $((attempt * 5))
          done
          echo 'FATAL: NDK could not be installed'
          exit 1

      - name: Install Gradle 7.6.4
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ========== 5. 用官方 build.sh 编译 deps ==========
      - name: Build native deps using official build.sh
        run: |
          sudo apt-get install -y python3 python3-pip wget
          pip3 install mako
          cd android/deps
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          sh build.sh
          echo "===== output ====="
          find output -maxdepth 3 -type d || true
          find output -name "*.a" || true

      # ========== 6. 提交 deps 到 Android-build（先删旧分支再建） ==========
      - name: Delete old Android-build branch if exists
        run: |
          git push origin --delete ${{ env.DEPS_BRANCH }} || true

      - name: Push deps to Android-build
        shell: bash
        run: |
          set -e
          rm -rf /tmp/deps-cache
          mkdir -p /tmp/deps-cache
          cp -r android/deps /tmp/deps-cache/deps
          cd /tmp/deps-cache
          rm -f deps/.gitignore
          rm -f deps/output/.gitignore
          git init -q
          git checkout -q -b "${{ env.DEPS_BRANCH }}"
          git add -f -A deps/output
          git add -A deps
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Android-Dependencies built from ${{ env.DEPS_COMMIT }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin "${{ env.DEPS_BRANCH }}"

      # ========== 7. 编译 APK ==========
      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$(dirname "$apk")"
          test -f "$apk"
          cp "$apk" SatDump-1.2.3-Android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satdump-android
          path: SatDump-1.2.3-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30
