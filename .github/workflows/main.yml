
name: Windows Full Error Scan

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  windows_build:
    name: Windows ${{ matrix.arch }} Error Scan
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-windows
            arch: x64
          - platform: arm64-windows
            arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg
          key: windows-${{ matrix.platform }}-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install mako
          "SATDUMP_PYTHON_EXECUTABLE=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Configure-vcpkg.ps1" -platform "${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean vcpkg temporary files
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          foreach ($dir in @("packages", "downloads", "buildtrees")) {
            $path = Join-Path $env:GITHUB_WORKSPACE "vcpkg\$dir"
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      - name: Configure CMake
        shell: powershell
        run: |
          $args = @(
            "-A", "${{ matrix.arch }}",
            "-DBUILD_MSVC=ON",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.platform }}",
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake",
            "-DPLUGIN_LIMESDR_SDR_SUPPORT=OFF",
            "-DPLUGIN_USRP_SDR_SUPPORT=OFF"
          )

          if ("${{ matrix.arch }}" -eq "ARM64") {
            $args += @(
              "-DVCPKG_HOST_TRIPLET=x64-windows",
              "-DVCPKG_USE_HOST_TOOLS=ON",
              "-DCMAKE_SYSTEM_VERSION=10.0.22621.0"
            )
          }

          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE\build" @args

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all independent targets
        shell: powershell
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\logs" | Out-Null

          $log = "$env:GITHUB_WORKSPACE\logs\build-${{ matrix.arch }}.log"

          Write-Host "Starting tolerant MSBuild..."
          Write-Host "Failed projects should not stop unrelated projects."

          cmake --build "$env:GITHUB_WORKSPACE\build" `
            --config $env:BUILD_TYPE `
            --parallel 4 2>&1 | Tee-Object -FilePath $log

          $buildCode = $LASTEXITCODE

          "BUILD_EXIT_CODE=$buildCode" | Out-File $log -Append

          Write-Host "Build completed with exit code: $buildCode"

      - name: Extract compiler errors
        if: always()
        shell: powershell
        run: |
          $log = "$env:GITHUB_WORKSPACE\logs\build-${{ matrix.arch }}.log"
          $report = "$env:GITHUB_WORKSPACE\logs\errors-${{ matrix.arch }}.txt"

          if (Test-Path $log) {
            $patterns = @(
              'error C[0-9]+',
              'fatal error',
              'error LNK[0-9]+',
              'error MSB[0-9]+',
              'FAILED:',
              'Skipping',
              'not built because'
            )

            Select-String -Path $log -Pattern $patterns |
              ForEach-Object { $_.Line } |
              Set-Content $report

            Write-Host "========== ERROR SUMMARY =========="
            Get-Content $report
          }

      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}-Error-Report
          path: logs/
          if-no-files-found: warn
