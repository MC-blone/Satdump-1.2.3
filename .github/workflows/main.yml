name: Build All

on: [push, workflow_dispatch]

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEPS_BRANCH: Build-temp

permissions:
  contents: write

jobs:
  build_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-x64
        with:
          path: windows/deps
          key: win-deps-x64-v10-${{ hashFiles('windows/build_deps.ps1') }}

      - name: Set up Python 3.13
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install mako
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        run: pip install mako

      - name: Add msbuild to PATH
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS Dev Env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clean deps before build
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          if (Test-Path "${{github.workspace}}\windows\deps") {
              Remove-Item -Recurse -Force "${{github.workspace}}\windows\deps"
          }

      - name: Build Deps
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: ${{github.workspace}}\windows
        run: .\build_deps.ps1

      - name: Verify Dependencies
        shell: powershell
        run: |
          $depsDir = "${{github.workspace}}\windows\deps\output"
          Write-Host "Checking dependencies in $depsDir"
          
          $missing = $false
          $checks = @(
              "include\curl\curl.h",
              "include\volk\volk_alloc.hh",
              "lib\volk.lib",
              "lib\libcurl_imp.lib"
          )
          
          foreach ($file in $checks) {
              $path = Join-Path $depsDir $file
              if (Test-Path $path) {
                  Write-Host "OK: $file" -ForegroundColor Green
              } else {
                  Write-Host "MISSING: $file" -ForegroundColor Red
                  $missing = $true
              }
          }
          
          if ($missing) {
              Write-Host "Listing output directory structure:"
              Get-ChildItem -Path $depsDir -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize
              Write-Error "Dependencies are incomplete, aborting build."
              exit 1
          }

      - name: Link deps to vcpkg directory
        shell: powershell
        run: |
          if (Test-Path "${{github.workspace}}\vcpkg") {
              Remove-Item -Recurse -Force "${{github.workspace}}\vcpkg"
          }
          New-Item -ItemType Directory -Force -Path "${{github.workspace}}\vcpkg" | Out-Null
          New-Item -ItemType Junction -Path "${{github.workspace}}\vcpkg\installed" -Target "${{github.workspace}}\windows\deps\output" | Out-Null

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        run: cmake -G Ninja -DCMAKE_FIND_ROOT_PATH="${{github.workspace}}/windows/deps/output" -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/windows/deps/output" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=AMD64 -DCMAKE_PREFIX_PATH="${{github.workspace}}/windows/deps/output" "$Env:GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ninja

      - name: Build Installer
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cpack -C $BUILD_TYPE

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Installer
          path: ${{runner.workspace}}/build/SatDump-*.exe

      - name: Add dumpbin to PATH
        run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

      - name: Build Portable
        shell: powershell
        working-directory: ${{runner.workspace}}/build
        run: ${{github.workspace}}\windows\make_portable.ps1 -source_path "$Env:GITHUB_WORKSPACE"

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Portable
          path: ${{runner.workspace}}/build/portable/*

  build_windows_arm64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-arm64
        with:
          path: windows/deps
          key: win-deps-arm64-v10-${{ hashFiles('windows/build_deps.ps1') }}

      - name: Set up Python 3.13
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install mako
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        run: pip install mako

      - name: Add msbuild to PATH
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS Dev Env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Clean deps before build
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          if (Test-Path "${{github.workspace}}\windows\deps") {
              Remove-Item -Recurse -Force "${{github.workspace}}\windows\deps"
          }

      - name: Build Deps
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: ${{github.workspace}}\windows
        run: .\build_deps.ps1 -is_cross 1 -is_arm 1

      - name: Verify Dependencies
        shell: powershell
        run: |
          $depsDir = "${{github.workspace}}\windows\deps\output"
          Write-Host "Checking dependencies in $depsDir"
          
          $missing = $false
          $checks = @(
              "include\curl\curl.h",
              "include\volk\volk_alloc.hh",
              "lib\volk.lib",
              "lib\libcurl_imp.lib"
          )
          
          foreach ($file in $checks) {
              $path = Join-Path $depsDir $file
              if (Test-Path $path) {
                  Write-Host "OK: $file" -ForegroundColor Green
              } else {
                  Write-Host "MISSING: $file" -ForegroundColor Red
                  $missing = $true
              }
          }
          
          if ($missing) {
              Write-Host "Listing output directory structure:"
              Get-ChildItem -Path $depsDir -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize
              Write-Error "Dependencies are incomplete, aborting build."
              exit 1
          }

      - name: Link deps to vcpkg directory
        shell: powershell
        run: |
          if (Test-Path "${{github.workspace}}\vcpkg") {
              Remove-Item -Recurse -Force "${{github.workspace}}\vcpkg"
          }
          New-Item -ItemType Directory -Force -Path "${{github.workspace}}\vcpkg" | Out-Null
          New-Item -ItemType Junction -Path "${{github.workspace}}\vcpkg\installed" -Target "${{github.workspace}}\windows\deps\output" | Out-Null

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        run: cmake -G Ninja -DCMAKE_FIND_ROOT_PATH="${{github.workspace}}/windows/deps/output" -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/windows/deps/output" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=arm64-windows -DCMAKE_CROSSCOMPILING=ON -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DCMAKE_PREFIX_PATH="${{github.workspace}}/windows/deps/output" "$Env:GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ninja

      - name: Build Installer
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cpack -C $BUILD_TYPE

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_arm64_Installer
          path: ${{runner.workspace}}/build/SatDump-*.exe

      - name: Add dumpbin to PATH
        run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

      - name: Build Portable
        shell: powershell
        working-directory: ${{runner.workspace}}/build
        run: ${{github.workspace}}\windows\make_portable.ps1 -source_path "$Env:GITHUB_WORKSPACE"

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_arm64_Portable
          path: ${{runner.workspace}}/build/portable/*

  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout SatDump source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show structure
        run: |
          echo "===== android/ ====="
          ls -la android/ || true
          echo "===== .gitmodules ====="
          cat .gitmodules || true

      - name: Restore prebuilt deps from Build-temp
        shell: bash
        run: |
          set -e
          git clone --no-checkout --depth 1 --branch "$DEPS_BRANCH" \
            https://github.com/MC-blone/Satdump-1.2.3.git /tmp/deps-cache
          cd /tmp/deps-cache
          git checkout "$DEPS_BRANCH" -- android/deps
          mkdir -p "$GITHUB_WORKSPACE/android"
          rm -rf "$GITHUB_WORKSPACE/android/deps"
          cp -r android/deps "$GITHUB_WORKSPACE/android/deps"
          rm -rf /tmp/deps-cache
          echo "===== restored lib/ ====="
          ls -la "$GITHUB_WORKSPACE/android/deps/output/arm64-v8a/lib/" | head -50 || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'

      - name: Install NDK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;25.2.9519653'; then
              test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
              exit 0
            fi
            rm -rf "$ANDROID_SDK_ROOT/ndk/25.2.9519653" "$ANDROID_SDK_ROOT/.temp"
            sleep $((attempt * 5))
          done
          echo 'FATAL: NDK could not be installed'
          exit 1

      - name: Install Gradle 7.6.4
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$(dirname "$apk")" || true
          test -f "$apk"
          cp "$apk" SatDump-1.2.3-Android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satdump-android
          path: SatDump-1.2.3-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  build_ubuntu_2204:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-22.04
          path: ${{runner.workspace}}/build/*.deb

      - name: Setup pkg2appimage
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: wget https://raw.githubusercontent.com/probonopd/AppImages/master/pkg2appimage && chmod +x pkg2appimage && sudo apt install -y imagemagick desktop-file-utils libfuse2

      - name: Make AppImage
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          cp *.deb /tmp/satdump.deb && cp $GITHUB_WORKSPACE/SatDump.yml .
          
          ./pkg2appimage SatDump.yml || true
          
          if [ -d "SatDump/SatDump.AppDir" ]; then
            rm -f SatDump/SatDump.AppDir/.DirIcon
            wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
            chmod +x appimagetool
            mkdir -p out
            ./appimagetool SatDump/SatDump.AppDir out/SatDump-x86_64.AppImage
          else
            echo "AppDir not found, pkg2appimage failed earlier"
            exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-AppImage
          path: ${{runner.workspace}}/build/out/*.AppImage

  build_ubuntu_2404:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-24.04
          path: ${{runner.workspace}}/build/*.deb

  build_linux_arm64:
    runs-on: ARM64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Delete build dir
        run: rm -rf ${{runner.workspace}}/build

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j4

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Pi64-Latest
          path: ${{runner.workspace}}/build/*.deb

  update_nightly_release:
    needs: [
        "build_windows_x64",
        "build_windows_arm64",
        "build_ubuntu_2204",
        "build_ubuntu_2404",
        "build_linux_arm64",
        "build_android"]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Install zip
        run: sudo apt install -y unzip

      - name: Copy files
        run: |
          mkdir satdump_out 
          cp SatDump-Ubuntu-22.04/satdump*.deb satdump_out/satdump_ubuntu_22.04_amd64.deb 
          cp SatDump-Ubuntu-24.04/satdump*.deb satdump_out/satdump_ubuntu_24.04_amd64.deb 
          (cd SatDump-Windows_x64_Portable && zip -r ../satdump_out/SatDump-Windows_x64_Portable.zip *) 
          cp SatDump-Windows_x64_Installer/SatDump-*.exe satdump_out/SatDump-Windows_x64_Installer.exe 
          cp SatDump-Pi64-Latest/satdump*.deb satdump_out/satdump_rpi64_latest_arm64.deb 
          cp satdump-android/SatDump-1.2.3-Android-arm64.apk satdump_out/SatDump-Android.apk 
          cp SatDump-AppImage/*.AppImage satdump_out/SatDump.AppImage 
          (cd SatDump-Windows_arm64_Portable && zip -r ../satdump_out/SatDump-Windows_arm64_Portable.zip *) 
          cp SatDump-Windows_arm64_Installer/SatDump-*.exe satdump_out/SatDump-Windows_arm64_Installer.exe

      - name: Update Nightly
        run: gh release upload nightly satdump_out/* -R ${{github.repository}} --clobber