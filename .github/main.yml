name: Build All

on: [push]

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-x64
        with:
          path: vcpkg
          key: win-deps-x64-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Set up Python 3.12
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install mako
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          python -m pip install mako
          python -c "import mako; print('mako OK for', __import__('sys').version)"
          "SATDUMP_PYTHON_EXECUTABLE=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Add msbuild to PATH
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Configure-vcpkg.ps1" -platform x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean up vcpkg
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          foreach ($dir in @("packages", "downloads", "buildtrees")) {
            $path = Join-Path $env:GITHUB_WORKSPACE "vcpkg\$dir"
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      - name: Download Aaronia RTSA API
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://www.satdump.org/Aaronia_RTSA_Suite_PRO_2.2.0.12821_Setup_64bit.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\vcpkg\rtsa.exe"

      - name: Install Aaronia RTSA API
        continue-on-error: true
        shell: cmd
        run: |
          if exist vcpkg\rtsa.exe (
            start /wait vcpkg\rtsa.exe /q2 /install
          ) else (
            echo Aaronia installer not downloaded; skipping
          )

      - name: Add support to NSIS for long PATHs
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Get-NSIS-LongStrings.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Build Environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake
        shell: powershell
        working-directory: ${{ runner.workspace }}/build
        run: |
          cmake -A x64 `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DPLUGIN_AARONIA_SDR_SUPPORT=ON `
            -DBUILD_MSVC=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            "$env:GITHUB_WORKSPACE"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: powershell
        run: |
          cmake --build . --config $env:BUILD_TYPE --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Installer
        working-directory: ${{ runner.workspace }}/build
        shell: powershell
        run: |
          cpack -C $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Installer
          path: ${{ runner.workspace }}/build/SatDump-*.exe
          if-no-files-found: error

      - name: Add dumpbin to PATH
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ tools not found"
          }

          $toolsRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $msvc = Get-ChildItem $toolsRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $msvc) {
            throw "MSVC toolset not found"
          }

          $dumpbinDir = Join-Path $msvc.FullName "bin\Hostx64\x64"

          if (-not (Test-Path (Join-Path $dumpbinDir "dumpbin.exe"))) {
            throw "dumpbin.exe not found: $dumpbinDir"
          }

          Write-Host "Using dumpbin: $dumpbinDir"
          Add-Content -Path $env:GITHUB_PATH -Value $dumpbinDir

      - name: Build Portable
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Finish-Release.ps1" `
            -platform x64-windows `
            -BuildPath "${{ runner.workspace }}\build"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Portable
          path: ${{ runner.workspace }}/build/Release/*
          if-no-files-found: error

  build_windows_arm64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-arm64
        with:
