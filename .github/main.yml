          key: win-deps-arm64-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Set up Python 3.12
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install mako
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          python -m pip install mako
          python -c "import mako; print('mako OK for', __import__('sys').version)"
          "SATDUMP_PYTHON_EXECUTABLE=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Add msbuild to PATH
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Configure-vcpkg.ps1" -platform arm64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean up vcpkg
        if: steps.win-deps-arm64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          foreach ($dir in @("packages", "downloads", "buildtrees")) {
            $path = Join-Path $env:GITHUB_WORKSPACE "vcpkg\$dir"
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      - name: Add support to NSIS for long PATHs
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Get-NSIS-LongStrings.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Build Environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake
        shell: powershell
        working-directory: ${{ runner.workspace }}/build
        run: |
          cmake -A ARM64 `
            -DVCPKG_TARGET_TRIPLET="arm64-windows" `
            -DVCPKG_HOST_TRIPLET="x64-windows" `
            -DVCPKG_USE_HOST_TOOLS=ON `
            -DCMAKE_SYSTEM_VERSION="10.0.22621.0" `
            -DPLUGIN_LIMESDR_SDR_SUPPORT=OFF `
            -DPLUGIN_USRP_SDR_SUPPORT=OFF `
            -DBUILD_MSVC=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            "$env:GITHUB_WORKSPACE"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: powershell
        run: |
          cmake --build . --config $env:BUILD_TYPE --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Installer
        working-directory: ${{ runner.workspace }}/build
        shell: powershell
        run: |
          cpack -C $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_arm64_Installer
          path: ${{ runner.workspace }}/build/SatDump-*.exe
          if-no-files-found: error

      - name: Add dumpbin to PATH
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ tools not found"
          }

          $toolsRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $msvc = Get-ChildItem $toolsRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $msvc) {
            throw "MSVC toolset not found"
          }

          $dumpbinDir = Join-Path $msvc.FullName "bin\Hostx64\x64"

          if (-not (Test-Path (Join-Path $dumpbinDir "dumpbin.exe"))) {
            throw "dumpbin.exe not found: $dumpbinDir"
          }

          Write-Host "Using dumpbin: $dumpbinDir"
          Add-Content -Path $env:GITHUB_PATH -Value $dumpbinDir

      - name: Build Portable
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\windows\Finish-Release.ps1" `
            -platform arm64-windows `
            -BuildPath "${{ runner.workspace }}\build"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_arm64_Portable
          path: ${{ runner.workspace }}/build/Release/*
          if-no-files-found: error

  build_android:
    runs-on: android-release

    steps:
      - uses: actions/checkout@v4

      - name: Get dependency version
        id: android-deps-ver
        shell: bash
        run: |
          commit=$(git -C "$GITHUB_WORKSPACE" submodule status | grep android)
          echo "deps_version=${commit:1:6}" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        id: android-deps
        with:
          path: android/deps
          key: android-deps-${{ steps.android-deps-ver.outputs.deps_version }}

      - name: Build dependencies
        if: steps.android-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule update --init
          cd "$GITHUB_WORKSPACE/android/deps"
          export ANDROID_HOME=/home/owner/android-sdk-linux
          sh build.sh
          rm -rf .git

      - name: Build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/android"
          export ANDROID_HOME=/home/owner/android-sdk-linux
          sh /home/owner/build_release.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-release.apk
          path: ${{ runner.workspace }}/SatDump/android/app/build/outputs/apk/release/app-release.apk

  build_ubuntu_2204:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: |
          sudo apt install -y \
            libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev \
            build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev \
            libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev \
            libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev \
            libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev \
            libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ runner.workspace }}/build
        run: cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-22.04
          path: ${{ runner.workspace }}/build/*.deb

  build_ubuntu_2404:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: |
          sudo apt install -y \
            libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk-dev \
            build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev \
            libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev \
            libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev \
            libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev \
            libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ runner.workspace }}/build
        run: cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-24.04
          path: ${{ runner.workspace }}/build/*.deb

  build_linux_arm64:
    runs-on: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: |
          sudo apt install -y \
            libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev \
            build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev \
            libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev \
            libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev \
            libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev \
            libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Delete build dir
        run: rm -rf ${{ runner.workspace }}/build

      - name: Create Build Environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ runner.workspace }}/build
        run: cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make -j4

      - name: Package
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Pi64-Latest
          path: ${{ runner.workspace }}/build/*.deb

  update_nightly_release:
    needs:
      - build_windows_x64
      - build_windows_arm64
      - build_ubuntu_2204
      - build_ubuntu_2404
      - build_linux_arm64
      - build_android

    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Install zip
        run: sudo apt install -y unzip

      - name: Copy files
        shell: bash
        run: |
          mkdir -p satdump_out

          cp SatDump-Ubuntu-22.04/satdump*.deb \
            satdump_out/satdump_ubuntu_22.04_amd64.deb

          cp SatDump-Ubuntu-24.04/satdump*.deb \
            satdump_out/satdump_ubuntu_24.04_amd64.deb

          (
            cd SatDump-Windows_x64_Portable
            zip -r ../satdump_out/SatDump-Windows_x64_Portable.zip *
          )

          cp SatDump-Windows_x64_Installer/SatDump-*.exe \
            satdump_out/SatDump-Windows_x64_Installer.exe

          (
            cd SatDump-Windows_arm64_Portable
            zip -r ../satdump_out/SatDump-Windows_arm64_Portable.zip *
          )

          cp SatDump-Windows_arm64_Installer/SatDump-*.exe \
            satdump_out/SatDump-Windows_arm64_Installer.exe

          cp SatDump-Pi64-Latest/satdump*.deb \
            satdump_out/satdump_rpi64_latest_arm64.deb

          cp SatDump-release.apk/app-release.apk \
            satdump_out/SatDump-Android.apk

      - name: Update Nightly
        run: gh release upload nightly satdump_out/* -R ${{ github.repository }} --clobber